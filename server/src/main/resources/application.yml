server:
  address: ${AUTOBAN_SERVER_ADDRESS:127.0.0.1}
  port: ${AUTOBAN_SERVER_PORT:59999}
  error:
    include-message: never

spring:
  application:
    name: autoban-server
  datasource:
    url: ${AUTOBAN_DB_URL}
    username: ${AUTOBAN_DB_USERNAME}
    password: ${AUTOBAN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

autoban:
  rules:
    admin-token: ${AUTOBAN_RULE_ADMIN_TOKEN:}
