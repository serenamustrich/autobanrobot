name: AutoBanRobot
options:
  bundleIdPrefix: com.autobanrobot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FZGF362JJD
targets:
  AutoBanRobot:
    type: application
    platform: iOS
    sources:
      - path: AutoBanRobot
      - path: Shared
      - path: ../injected.js
        buildPhase: resources
      - path: ../default-keywords.json
        buildPhase: resources
      - path: ../default-rules.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autobanrobot.ios
        INFOPLIST_FILE: AutoBanRobot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: AutoBanRobotLiveActivity
        embed: true
  AutoBanRobotLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoBanRobotLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autobanrobot.ios.liveactivity
        INFOPLIST_FILE: AutoBanRobotLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  AutoBanRobotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AutoBanRobotTests
    dependencies:
      - target: AutoBanRobot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autobanrobot.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AutoBanRobot:
    build:
      targets:
        AutoBanRobot: all
        AutoBanRobotLiveActivity: all
        AutoBanRobotTests: [test]
    test:
      targets:
        - AutoBanRobotTests
