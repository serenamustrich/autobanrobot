<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; padding: 14px 16px; font-family: -apple-system, sans-serif; margin: 0; }
    h3 { margin: 0 0 10px; font-size: 13px; color: #0f1419; }
    .count { font-size: 36px; font-weight: 700; color: #1d9bf0; line-height: 1; }
    .label { color: #71767b; font-size: 11px; margin-top: 3px; }
    hr { border: none; border-top: 1px solid #eff3f4; margin: 10px 0; }
    .section-label { font-size: 11px; color: #444; margin-bottom: 4px; }
    textarea {
      width: 100%; box-sizing: border-box;
      height: 80px; font-size: 12px; border: 1px solid #cfd9de;
      border-radius: 6px; padding: 6px; resize: vertical;
      font-family: inherit; outline: none;
    }
    textarea:focus { border-color: #1d9bf0; }
    button {
      margin-top: 6px; width: 100%; padding: 6px;
      background: #1d9bf0; color: #fff; border: none;
      border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    button:hover { background: #1a8cd8; }
    .saved { font-size: 11px; color: #00ba7c; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <h3>🤖 Bot Blocker</h3>
  <div class="count" id="count">—</div>
  <div class="label">本次已屏蔽</div>
  <hr>
  <div class="section-label">关键词（每行一个）：</div>
  <textarea id="keywords" placeholder="同城&#10;上门"></textarea>
  <button id="save">保存</button>
  <div class="saved" id="saved">✓ 已保存，立即生效</div>
  <script src="popup.js"></script>
</body>
</html>
